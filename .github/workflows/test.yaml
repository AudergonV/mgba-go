name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # libmgba-dev provides the C headers and shared library required by CGo
      - name: Install libmgba
        run: sudo apt-get update && sudo apt-get install -y libmgba-dev

      - name: Run unit tests
        run: make test
